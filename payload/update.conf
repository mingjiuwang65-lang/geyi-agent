# GeYiProxy update.conf - auto upgrade settings (editable in the config window)
# UPDATE_URL: http(s) URL, UNC path or local folder containing update.manifest
# AUTO_UPDATE: 1 = install automatically when the rollout phase allows this host;
#              0 = only notify, a human must click "安装更新" in the tray menu
# CHECK_INTERVAL_MIN: minimum minutes between two manifest checks (Guard is PT1M)
UPDATE_URL=http://10.0.50.199:15889/geyi/update.manifest
AUTO_UPDATE=1
CHECK_INTERVAL_MIN=60
